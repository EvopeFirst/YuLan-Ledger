<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#165744"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><title>玉兰小账</title><body>
<header><b>✿　玉兰小账</b><small id="offline">检查离线状态…</small></header>
<main><section id="overview"><h1>收支总览</h1><label>统计时段<select id="period"><option>本月</option><option>上月</option><option>最近七天</option><option>自选日期</option></select></label><div class="pair" id="range" hidden><label>开始<input type="date" id="start"></label><label>结束<input type="date" id="end"></label></div>
<article class="hero"><small>实际支出</small><strong id="total">¥0.00</strong><div class="pair"><span>个人收入 <b id="income"></b></span><span>结余 <b id="net"></b></span></div></article><button class="primary" id="add">＋ 记一笔</button><h2>钱花在哪</h2><div id="cats"></div></section>
<section id="flow" hidden><h1>账本流水</h1><details><summary>导入微信或支付宝账单</summary><p>选择微信或支付宝 XLSX 对账文件，在本机预览。导入历史流水前，请确认期初余额对应的是这段流水开始前的余额。</p><input id="wxFile" type="file" accept=".xlsx"><button id="wxPreview">预览账单</button><div id="wxRows"></div></details><p id="filter"></p><button id="all">查看全部流水</button><div id="rows"></div></section>
<section id="accounts" hidden><h1>我的账户</h1><div id="balances"></div><h2>玉兰卡</h2><div id="shortcuts"></div></section>
<section id="backup" hidden><h1>账本备份</h1><p>用密码加密后导出文件，再将文件保存到百度网盘。恢复时需要同一密码。</p><label>备份密码（至少 8 位）<input id="password" type="password" autocomplete="off"></label><button id="export" class="primary">导出加密备份</button><h2>从备份恢复</h2><label>选择备份文件<input id="file" type="file" accept=".json"></label><button id="restore">预览并恢复</button></section></main>
<nav><button data-page="overview">总览</button><button data-page="flow">流水</button><button data-page="accounts">账户</button><button data-page="backup">备份</button></nav>
<dialog id="editor"><form id="form"><h2 id="formTitle">记一笔</h2><label>类型<select id="kind"></select></label><div class="pair"><label>金额（元）<input id="amt" inputmode="decimal" required></label><label>日期<input id="day" type="date" required></label></div><label>付款或收款方式<select id="account"></select></label><label id="destLabel">转入账户<select id="dest"></select></label><label id="catLabel">分类<input id="category" list="choices" maxlength="40"></label><datalist id="choices"></datalist><label>备注<input id="note" maxlength="200"></label><label><input type="checkbox" id="again"> 保存后继续记同一天</label><div class="pair"><button type="button" id="cancel">取消</button><button class="primary">保存</button></div></form></dialog>
<script src="app.js" defer></script><script src="read-excel-file.min.js" defer></script><script src="wechat.js" defer></script></body></html>
